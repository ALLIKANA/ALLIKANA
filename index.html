const interpolar=(tabla,mes,campo)=>{const exact=tabla.find(r=>r.m===mes);if(exact) return exact[campo];const prev=[...tabla].filter(r=>r.m<mes).pop();const next=tabla.find(r=>r.m>mes);if(!prev||!next) return null;return +(prev[campo]+(next[campo]-prev[campo])*((mes-prev.m)/(next.m-prev.m))).toFixed(2);};
const clasificar=(val,mes,tabla)=>{if(!val||mes===null) return null;const v=parseFloat(val);const p3=interpolar(tabla,mes,"p3"),p15=interpolar(tabla,mes,"p15"),p85=interpolar(tabla,mes,"p85"),p97=interpolar(tabla,mes,"p97");if(p3===null) return null;if(v<p3) return{label:"Muy bajo (< P3)",color:"#ef4444"};if(v<p15) return{label:"Bajo (P3-P15)",color:"#f97316"};if(v<p85) return{label:"Normal (P15-P85)",color:"#22c55e"};if(v<p97) return{label:"Alto (P85-P97)",color:"#f59e0b"};return{label:"Muy alto (> P97)",color:"#ef4444"};};
const buildChart=(tabla,mesActual,valor)=>{const maxM=tabla[tabla.length-1].m;const pts=new Set([...tabla.map(r=>r.m)]);if(mesActual!==null) pts.add(mesActual);return [...pts].filter(m=>m<=maxM).sort((a,b)=>a-b).map(m=>{const row={m};["p3","p15","p50","p85","p97"].forEach(p=>{row[p]=interpolar(tabla,m,p);});if(m===mesActual&&valor) row.paciente=parseFloat(valor);return row;});};

function CIE10Search({onSelect}){

  return(<div style={{position:"relative"}}><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar CIE-10 por código o descripción..."/>{res.length>0&&(<div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,zIndex:200,maxHeight:220,overflowY:"auto",boxShadow:"0 4px 12px rgba(0,0,0,.08)"}}>{res.map(r=>(<div key={r.c} onMouseDown={e=>{e.preventDefault();onSelect(r);setQ("");}} style={{padding:"7px 12px",cursor:"pointer",fontSize:13,display:"flex",gap:8,borderBottom:"1px solid #f1f5f9"}}><span style={{fontWeight:500,color:"#2563eb",minWidth:56,flexShrink:0}}>{r.c}</span><span>{r.d}</span></div>))}</div>)}</div>);

function DxBlock({diagnosticos,setDiagnosticos}){

  const rem=id=>setDiagnosticos(p=>p.filter(x=>x.id!==id));
  const chg=(id,tipo)=>setDiagnosticos(p=>p.map(x=>x.id===id?{...x,tipo}:x));
  return(<div><CIE10Search onSelect={add}/>{diagnosticos.length>0&&(<div style={{marginTop:8,display:"flex",flexDirection:"column",gap:6}}>{diagnosticos.map(d=>(<div key={d.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:"#fff",borderRadius:6,fontSize:13,border:"1px solid #e2e8f0"}}><span style={{fontWeight:500,color:"#2563eb",minWidth:56,flexShrink:0}}>{d.c}</span><span style={{flex:1}}>{d.d}</span><select value={d.tipo} onChange={e=>chg(d.id,e.target.value)} style={{fontSize:12,width:"auto"}}>{TIPOS_DX.map(t=><option key={t}>{t}</option>)}</select><button onMouseDown={e=>{e.preventDefault();rem(d.id);}} style={{border:"none",background:"none",color:"#ef4444",cursor:"pointer",fontSize:20,lineHeight:1,padding:0}}>×</button></div>))}</div>)}</div>);
}
function Odontograma({data,onChange}){

    {Object.keys(data).filter(k=>data[k].condicion!=="Sano").length>0&&(<div style={{marginTop:10}}><p style={{fontSize:12,fontWeight:500,marginBottom:6,color:"#64748b"}}>Hallazgos</p><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{Object.entries(data).filter(([,v])=>v.condicion!=="Sano").map(([p,v])=>(<span key={p} style={{...s.badge(COND_COLOR[v.condicion]||"#94a3b8")}}>{p}: {v.condicion}{v.nota?` · ${v.nota}`:""}</span>))}</div></div>)}
  </div>);
}
function CurvaG({titulo,tabla,valor,mes,unidad}){
  const data=useMemo(()=>buildChart(tabla,mes,valor),[tabla,mes,valor]);
  return(<div style={{marginBottom:16}}><p style={{fontSize:12,fontWeight:500,margin:"0 0 4px",color:"#64748b"}}>{titulo}</p>
    <ResponsiveContainer width="100%" height={190}><LineChart data={data} margin={{top:4,right:12,bottom:16,left:0}}>
      <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/>
      <XAxis dataKey="m" tick={{fontSize:10}} label={{value:"Meses",position:"insideBottom",offset:-10,fontSize:10}} interval={5}/>
      <YAxis tick={{fontSize:10}}/>
      <Tooltip formatter={(v,n)=>[v?v.toFixed(1)+" "+unidad:"-",n]} labelFormatter={l=>"Mes "+l}/>
      <Legend wrapperStyle={{fontSize:10,paddingTop:8}}/>
      <Line type="monotone" dataKey="p3" stroke="#94a3b8" dot={false} strokeDasharray="4 2" name="P3" strokeWidth={1} connectNulls/>
      <Line type="monotone" dataKey="p15" stroke="#f59e0b" dot={false} strokeDasharray="4 2" name="P15" strokeWidth={1} connectNulls/>
      <Line type="monotone" dataKey="p50" stroke="#22c55e" dot={false} name="P50" strokeWidth={2} connectNulls/>
      <Line type="monotone" dataKey="p85" stroke="#f59e0b" dot={false} strokeDasharray="4 2" name="P85" strokeWidth={1} connectNulls/>
      <Line type="monotone" dataKey="p97" stroke="#94a3b8" dot={false} strokeDasharray="4 2" name="P97" strokeWidth={1} connectNulls/>
      {mes!==null&&valor&&<ReferenceDot x={mes} y={parseFloat(valor)} r={6} fill="#1d4ed8" stroke="#fff" strokeWidth={2}/>}
    </LineChart></ResponsiveContainer>
  </div>);
}
function CurvasOMS({peso,talla,imc,fechaNac,sexo}){
  const mes=ageMonths(fechaNac);if(mes===null||mes<0||mes>120) return null;
  const fem=sexo==="Femenino";
  const tP=fem?WHO_PESO_F:WHO_PESO_M,tT=fem?WHO_TALLA_F:WHO_TALLA_M,tI=fem?WHO_IMC_F:WHO_IMC_M;
  return(<div style={{marginTop:12,padding:12,background:"#fff",border:"1px solid #e2e8f0",borderRadius:8}}>
    <p style={{fontWeight:500,fontSize:13,margin:"0 0 2px"}}>📈 Curvas OMS (0–120 meses)</p>
    <p style={{fontSize:11,color:"#64748b",margin:"0 0 10px"}}>{mes} meses · {sexo||"sexo no registrado"}</p>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
      {[["Peso",peso,tP],["Talla",talla,tT],["IMC",imc,tI]].map(([lbl,v,t])=>{const c=clasificar(v,mes,t);return c&&<span key={lbl} style={{...s.badge(c.color)}}>{lbl}: {c.label}</span>;})}
    </div>
    {peso&&<CurvaG titulo={`Peso — ${sexo||""}`} tabla={tP} valor={peso} mes={mes} unidad="kg"/>}
    {talla&&<CurvaG titulo={`Talla — ${sexo||""}`} tabla={tT} valor={talla} mes={mes} unidad="cm"/>}
    {imc&&<CurvaG titulo={`IMC — ${sexo||""}`} tabla={tI} valor={imc} mes={mes} unidad="kg/m²"/>}
  </div>);
}
function SVBanner({sv}){

  return(<div><p style={{fontSize:11,color:"#64748b",margin:"0 0 4px"}}>{sv.fecha}</p><p style={{fontSize:12,margin:0,lineHeight:1.8}}>{svResumen(sv)}</p></div>);
}

function App(){
  const [tab,setTab]=useState(0);

  const [exF,setExF]=useState({laboratorio:"",imagenes:"",otros:""});

  const [oF,setOF]=useState(emptyOdonto);

  const [exList,setExList]=useState([]);
  const [consList,setConsList]=useState([]);
  const [odList,setOdList]=useState([]);
  const [admMode,setAdmMode]=useState("search");
  const [q,setQ]=useState("");
  const [selPat,setSelPat]=useState(null);
  const [msg,setMsg]=useState(null);
  const [loading,setLoading]=useState(false);
  const [rf1,setRf1]=useState("");
  const [rf2,setRf2]=useState("");

  const flash=useCallback((text,type="success")=>{setMsg({text,type});setTimeout(()=>setMsg(null),4000);},[]);

  useEffect(()=>{

  const filtered=useMemo(()=>patients.filter(p=>p.cedula?.includes(q)||(`${p.apellidos} ${p.nombres}`).toLowerCase().includes(q.toLowerCase())),[patients,q]);

  const loadPacData=useCallback(async(p)=>{
    setLoading(true);
    const [ant,sv,ex,cons,od]=await Promise.all([
      supa.from("antecedentes").select("*").eq("paciente_id",p.id).single(),
      supa.from("signos_vitales").select("*").eq("paciente_id",p.id).order("created_at",{ascending:false}),
      supa.from("examenes").select("*").eq("paciente_id",p.id).order("created_at",{ascending:false}),
      supa.from("consultas").select("*").eq("paciente_id",p.id).order("created_at",{ascending:false}),
      supa.from("consultas_odonto").select("*").eq("paciente_id",p.id).order("created_at",{ascending:false}),
    ]);
    setAntF(ant.data||emptyAnt());
    setSvList(sv.data||[]);
    setExList(ex.data||[]);
    setConsList(cons.data||[]);
    setOdList(od.data||[]);
    setSvF(emptySV());
    setExF({laboratorio:"",imagenes:"",otros:""});
    setCF(emptyConsulta());
    const lastO=od.data?.[0];
    setOF({...emptyOdonto(),odontograma:lastO?.odontograma||{}});
    setLoading(false);
  },[]);

  const pickPat=useCallback(async(p,goTab)=>{
    setSelPat(p);
    await loadPacData(p);
    setTab(goTab);
  },[loadPacData]);

  const ultimoSV=useMemo(()=>svList[0]||null,[svList]);
  const updSV=useCallback((key,val)=>{setSvF(p=>{const n={...p,[key]:val};if(key==="peso"||key==="talla")n.imc=calcIMC(key==="peso"?val:p.peso,key==="talla"?val:p.talla);return n;});},[]);
  const mesesPat=selPat?ageMonths(selPat.fecha_nac):null;
  const showCurvas=mesesPat!==null&&mesesPat>=0&&mesesPat<=120;

  const saveAdm=useCallback(async()=>{
    if(!patF.cedula||!patF.apellidos||!patF.nombres||!patF.fechaNac||!patF.sexo) return flash("Campos obligatorios: cédula, apellidos, nombres, fecha nac., sexo","error");
    setLoading(true);
    const {data,error}=await supa.from("pacientes").insert([{
      cedula:patF.cedula,apellidos:patF.apellidos,nombres:patF.nombres,fecha_nac:patF.fechaNac,
      sexo:patF.sexo,etnia:patF.etnia,estado_civil:patF.estadoCivil,instruccion:patF.instruccion,
      ocupacion:patF.ocupacion,empresa:patF.empresa,telefono:patF.telefono,celular:patF.celular,
      email:patF.email,direccion:patF.direccion,provincia:patF.provincia,canton:patF.canton,
      parroquia:patF.parroquia,seguro:patF.seguro,n_afiliacion:patF.nAfiliacion,
      contacto_nombre:patF.contactoNombre,contacto_tel:patF.contactoTel,contacto_parentesco:patF.contactoParentesco,
    }]).select();

    const {error}=exists.data

  const NoPac=({goTab})=>(<div><p style={{fontSize:13,color:"#64748b",marginBottom:10}}>Seleccione el paciente:</p><input placeholder="Buscar por cédula o nombre..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:12}}/>{patients.length===0&&<p style={{fontSize:13,color:"#94a3b8"}}>No hay pacientes. Ve a Admisión.</p>}{filtered.map(p=><PacCard key={p.id} p={p} goTab={goTab}/>)}</div>);

  return(<div style={s.wrap}>
    <div style={{marginBottom:16,paddingBottom:12,borderBottom:"1px solid #e2e8f0"}}>
      <h2 style={{fontSize:20,fontWeight:700,color:"#1e293b",margin:"0 0 2px"}}>ALLIKANA</h2>
      <p style={{fontSize:12,color:"#64748b",margin:0}}>Odontología y Medicina Familiar · Historia clínica v1.5 · MSP Ecuador</p>
    </div>
    <div style={{display:"flex",gap:1,marginBottom:16,borderBottom:"1px solid #e2e8f0",flexWrap:"wrap"}}>
      {TABS.map((t,i)=>(<button key={t} onClick={()=>setTab(i)} style={s.tab(tab===i)}>{t}</button>))}
    </div>
    {loading&&<div style={{padding:"8px 14px",borderRadius:8,marginBottom:12,fontSize:13,background:"#eff6ff",color:"#1d4ed8"}}>⏳ Guardando...</div>}
    {msg&&<div style={s.msg(msg.type)}>{msg.text}</div>}

    {/* TAB 0: ADMISIÓN */}
    {tab===0&&(<div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button onClick={()=>setAdmMode("search")} style={{fontWeight:admMode==="search"?600:400}}>Buscar paciente</button>
        <button className="primary" onClick={()=>setAdmMode("new")}>+ Nuevo paciente</button>
      </div>
      {admMode==="search"&&(<div><input placeholder="Buscar por cédula o nombre..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:12}}/>{patients.length===0&&<p style={{fontSize:13,color:"#94a3b8"}}>No hay pacientes registrados.</p>}{filtered.map(p=><PacCard key={p.id} p={p} goTab={4}/>)}</div>)}
      {admMode==="new"&&(<div>
        <Sec title="Identificación"><div style={s.grid()}>
          <TF label="Cédula / Pasaporte *" value={patF.cedula} onChange={v=>setPatF(p=>({...p,cedula:v}))}/>
          <TF label="Apellidos *" value={patF.apellidos} onChange={v=>setPatF(p=>({...p,apellidos:v}))}/>
          <TF label="Nombres *" value={patF.nombres} onChange={v=>setPatF(p=>({...p,nombres:v}))}/>
          <div><label style={s.label}>Fecha de nacimiento *</label><input type="date" value={patF.fechaNac} onChange={e=>setPatF(p=>({...p,fechaNac:e.target.value}))}/>{patF.fechaNac&&<span style={{fontSize:11,color:"#2563eb",marginTop:3,display:"block"}}>🎂 {calcAgeDetail(patF.fechaNac)}</span>}</div>
          <SF label="Sexo *" value={patF.sexo} onChange={v=>setPatF(p=>({...p,sexo:v}))} opts={["Masculino","Femenino"]}/>
          <SF label="Etnia" value={patF.etnia} onChange={v=>setPatF(p=>({...p,etnia:v}))} opts={ETNIAS}/>
          <SF label="Estado civil" value={patF.estadoCivil} onChange={v=>setPatF(p=>({...p,estadoCivil:v}))} opts={ESTADO_CIVIL}/>
          <SF label="Instrucción" value={patF.instruccion} onChange={v=>setPatF(p=>({...p,instruccion:v}))} opts={INSTRUCCION}/>
          <TF label="Ocupación" value={patF.ocupacion} onChange={v=>setPatF(p=>({...p,ocupacion:v}))}/>
          <TF label="Empresa / Institución" value={patF.empresa} onChange={v=>setPatF(p=>({...p,empresa:v}))}/>
        </div></Sec>
        <Sec title="Contacto y dirección"><div style={s.grid()}>
          <TF label="Teléfono fijo" value={patF.telefono} onChange={v=>setPatF(p=>({...p,telefono:v}))}/>
          <TF label="Celular" value={patF.celular} onChange={v=>setPatF(p=>({...p,celular:v}))}/>
          <TF label="Email" value={patF.email} onChange={v=>setPatF(p=>({...p,email:v}))} type="email"/>
          <TF label="Dirección" value={patF.direccion} onChange={v=>setPatF(p=>({...p,direccion:v}))}/>
          <SF label="Provincia" value={patF.provincia} onChange={v=>setPatF(p=>({...p,provincia:v}))} opts={PROVINCIAS}/>
          <TF label="Cantón" value={patF.canton} onChange={v=>setPatF(p=>({...p,canton:v}))}/>
          <TF label="Parroquia" value={patF.parroquia} onChange={v=>setPatF(p=>({...p,parroquia:v}))}/>
        </div></Sec>
        <Sec title="Seguro de salud"><div style={s.grid("1fr 1fr")}>
          <SF label="Tipo de seguro" value={patF.seguro} onChange={v=>setPatF(p=>({...p,seguro:v}))} opts={SEGURO}/>
          <TF label="N° afiliación" value={patF.nAfiliacion} onChange={v=>setPatF(p=>({...p,nAfiliacion:v}))}/>
        </div></Sec>
        <Sec title="Contacto de emergencia"><div style={s.grid()}>
          <TF label="Nombre" value={patF.contactoNombre} onChange={v=>setPatF(p=>({...p,contactoNombre:v}))}/>
          <TF label="Teléfono" value={patF.contactoTel} onChange={v=>setPatF(p=>({...p,contactoTel:v}))}/>
          <TF label="Parentesco" value={patF.contactoParentesco} onChange={v=>setPatF(p=>({...p,contactoParentesco:v}))}/>
        </div></Sec>
        <button className="primary" onClick={saveAdm}>Guardar admisión</button>
      </div>)}
    </div>)}

    {/* TAB 1: ANTECEDENTES */}
    {tab===1&&(<div>{!selPat?<NoPac goTab={1}/>:(<div><Banner/>
      {[["Antecedentes heredofamiliares","antHeredoFam"],["Antecedentes personales patológicos","antPersonalesPatologicos"],["Antecedentes personales no patológicos","antPersonalesNoPatologicos"],["Antecedentes gineco-obstétricos","antGinecoObstetricos"],["Alergias","alergias"],["Medicamentos actuales","medicamentosActuales"],["Hábitos","habitos"],["Vacunas","vacunas"]].map(([lbl,key])=>(<Sec key={key} title={lbl}><TA label="" value={antF[key]||""} onChange={v=>setAntF(p=>({...p,[key]:v}))} rows={2}/></Sec>))}
      <button className="primary" onClick={saveAnt}>Guardar antecedentes</button>
    </div>)}</div>)}

    {/* TAB 2: SIGNOS VITALES */}
    {tab===2&&(<div>{!selPat?<NoPac goTab={2}/>:(<div><Banner/>
      <Sec title="Registro de signos vitales y antropometría">
        <div style={s.grid("repeat(auto-fit,minmax(110px,1fr))")}>
          <div><label style={s.label}>Fecha</label><input type="date" value={svF.fecha} onChange={e=>updSV("fecha",e.target.value)}/></div>
          <TF label="TA (mmHg)" value={svF.ta} onChange={v=>updSV("ta",v)}/>
          <TF label="FC (lpm)" value={svF.fc} onChange={v=>updSV("fc",v)}/>
          <TF label="FR (rpm)" value={svF.fr} onChange={v=>updSV("fr",v)}/>
          <TF label="Temp (°C)" value={svF.temp} onChange={v=>updSV("temp",v)}/>
          <TF label="Peso (kg)" value={svF.peso} onChange={v=>updSV("peso",v)}/>
          <TF label="Talla (cm)" value={svF.talla} onChange={v=>updSV("talla",v)}/>
          <div><label style={s.label}>IMC</label><input readOnly value={svF.imc} style={{background:"#f8fafc"}}/></div>
          <TF label="SatO2 (%)" value={svF.sat} onChange={v=>updSV("sat",v)}/>
          <TF label="Per. abdominal (cm)" value={svF.perAbdominal} onChange={v=>updSV("perAbdominal",v)}/>
        </div>
        {showCurvas&&(svF.peso||svF.talla)?<CurvasOMS peso={svF.peso} talla={svF.talla} imc={svF.imc} fechaNac={selPat.fecha_nac} sexo={selPat.sexo}/>:showCurvas&&<p style={{fontSize:12,color:"#2563eb",marginTop:8}}>📈 Paciente menor de 10 años — ingrese peso y/o talla para ver las curvas OMS.</p>}
      </Sec>
      <button className="primary" onClick={saveSV}>Guardar signos vitales</button>
      {svList.length>0&&(<div style={{marginTop:16}}><p style={{fontWeight:500,fontSize:13,marginBottom:8}}>Historial de signos vitales</p>
        {svList.map(sv=>(<div key={sv.id} style={{border:"1px solid #e2e8f0",borderRadius:8,marginBottom:8,overflow:"hidden"}}><div style={{padding:"7px 14px",background:"#f8fafc",fontSize:13,fontWeight:500}}>{sv.fecha}</div><div style={{padding:"8px 14px",fontSize:12,color:"#64748b"}}>{svResumen(sv)}</div></div>))}
      </div>)}
    </div>)}</div>)}

    {/* TAB 3: EXÁMENES */}
    {tab===3&&(<div>{!selPat?<NoPac goTab={3}/>:(<div><Banner/>
      <Sec title="Nuevo registro de exámenes"><div style={{display:"flex",flexDirection:"column",gap:10}}>
        <TA label="Laboratorio (resultados, valores de referencia)" value={exF.laboratorio} onChange={v=>setExF(p=>({...p,laboratorio:v}))} rows={4}/>
        <TA label="Imágenes (ecografía, radiografía, TAC, RMN)" value={exF.imagenes} onChange={v=>setExF(p=>({...p,imagenes:v}))} rows={3}/>
        <TA label="Otros (ECG, espirometría, etc.)" value={exF.otros} onChange={v=>setExF(p=>({...p,otros:v}))} rows={2}/>
      </div><button className="primary" onClick={saveEx} style={{marginTop:12}}>Guardar exámenes</button></Sec>
      {exList.length>0&&(<div><p style={{fontWeight:500,fontSize:13,marginBottom:8}}>Historial de exámenes</p>
        {exList.map(e=>(<div key={e.id} style={{border:"1px solid #e2e8f0",borderRadius:8,marginBottom:10,overflow:"hidden"}}><div style={{padding:"7px 14px",background:"#f8fafc",fontSize:13,fontWeight:500}}>{e.fecha}</div><div style={{padding:"10px 14px",fontSize:13,display:"flex",flexDirection:"column",gap:5}}>{e.laboratorio&&<p style={{margin:0}}><strong>Laboratorio:</strong> {e.laboratorio}</p>}{e.imagenes&&<p style={{margin:0}}><strong>Imágenes:</strong> {e.imagenes}</p>}{e.otros&&<p style={{margin:0}}><strong>Otros:</strong> {e.otros}</p>}</div></div>))}
      </div>)}
    </div>)}</div>)}

    {/* TAB 4: CONSULTA MÉDICA */}
    {tab===4&&(<div>{!selPat?<NoPac goTab={4}/>:(<div><Banner/>
      <Sec title="Tipo de consulta (Form. 008 MSP)">
        <div style={s.grid("1fr 1fr")}><SF label="Tipo de consulta" value={cF.tipoConsulta} onChange={v=>setCF(p=>({...p,tipoConsulta:v}))} opts={TIPO_CONSULTA}/><SF label="Causa de consulta" value={cF.causaConsulta} onChange={v=>setCF(p=>({...p,causaConsulta:v}))} opts={CAUSA_CONSULTA}/></div>
        <div style={{marginTop:10}}><TF label="Fecha" value={cF.fecha} onChange={v=>setCF(p=>({...p,fecha:v}))} type="date"/></div>
      </Sec>
      <Sec title="Signos vitales del día"><SVBanner sv={ultimoSV}/></Sec>
      <Sec title="Motivo y enfermedad actual"><div style={{display:"flex",flexDirection:"column",gap:10}}>
        <TF label="Motivo de consulta *" value={cF.motivo} onChange={v=>setCF(p=>({...p,motivo:v}))}/>
        <TA label="Enfermedad o problema actual" value={cF.enfActual} onChange={v=>setCF(p=>({...p,enfActual:v}))}/>
      </div></Sec>
      <Sec title="Examen físico"><TA label="Hallazgos" value={cF.examenFisico} onChange={v=>setCF(p=>({...p,examenFisico:v}))}/></Sec>
      <Sec title="Diagnósticos CIE-10"><DxBlock diagnosticos={cF.diagnosticos} setDiagnosticos={d=>setCF(p=>({...p,diagnosticos:typeof d==="function"?d(p.diagnosticos):d}))}/></Sec>
      <Sec title="Plan y tratamiento"><div style={{display:"flex",flexDirection:"column",gap:10}}>
        <TA label="Plan de manejo / indicaciones" value={cF.plan} onChange={v=>setCF(p=>({...p,plan:v}))}/>
        <TA label="Receta / prescripción" value={cF.receta} onChange={v=>setCF(p=>({...p,receta:v}))}/>
      </div></Sec>
      <button className="primary" onClick={saveCons}>Guardar consulta médica</button>
    </div>)}</div>)}

    {/* TAB 5: ODONTOLOGÍA */}
    {tab===5&&(<div>{!selPat?<NoPac goTab={5}/>:(<div><Banner/>
      <Sec title="Tipo de consulta"><div style={s.grid("1fr 1fr")}><SF label="Tipo de consulta" value={oF.tipoConsulta} onChange={v=>setOF(p=>({...p,tipoConsulta:v}))} opts={TIPO_CONSULTA}/><TF label="Fecha" value={oF.fecha} onChange={v=>setOF(p=>({...p,fecha:v}))} type="date"/></div></Sec>
      <Sec title="Signos vitales del día"><SVBanner sv={ultimoSV}/></Sec>
      <Sec title="Motivo y anamnesis"><div style={{display:"flex",flexDirection:"column",gap:10}}>
        <TF label="Motivo de consulta *" value={oF.motivo} onChange={v=>setOF(p=>({...p,motivo:v}))}/>
        <TA label="Examen extraoral" value={oF.examenExtraoral} onChange={v=>setOF(p=>({...p,examenExtraoral:v}))} rows={2}/>
        <TA label="Examen intraoral" value={oF.examenIntraoral} onChange={v=>setOF(p=>({...p,examenIntraoral:v}))} rows={2}/>
        <TF label="Índice de higiene oral" value={oF.higiene} onChange={v=>setOF(p=>({...p,higiene:v}))}/>
      </div></Sec>
      <Sec title="Odontograma FDI/ISO"><Odontograma data={oF.odontograma} onChange={od=>setOF(p=>({...p,odontograma:od}))}/></Sec>
      <Sec title="Diagnósticos CIE-10"><DxBlock diagnosticos={oF.diagnosticos} setDiagnosticos={d=>setOF(p=>({...p,diagnosticos:typeof d==="function"?d(p.diagnosticos):d}))}/></Sec>
      <Sec title="Plan y tratamiento"><div style={{display:"flex",flexDirection:"column",gap:10}}>
        <TA label="Plan de tratamiento" value={oF.plan} onChange={v=>setOF(p=>({...p,plan:v}))}/>
        <TA label="Tratamiento realizado" value={oF.tratamientoRealizado} onChange={v=>setOF(p=>({...p,tratamientoRealizado:v}))}/>
        <TA label="Observaciones" value={oF.observaciones} onChange={v=>setOF(p=>({...p,observaciones:v}))} rows={2}/>
      </div></Sec>
      <button className="primary" onClick={saveOd}>Guardar consulta odontológica</button>
    </div>)}</div>)}

    {/* TAB 6: HISTORIAL */}
    {tab===6&&(<div>{!selPat?<NoPac goTab={6}/>:(<div><Banner/>
      {consList.length>0&&(<div style={{marginBottom:16}}><p style={{fontWeight:500,fontSize:14,marginBottom:8}}>🩺 Consultas médicas</p>
        {consList.map(c=>(<div key={c.id} style={{border:"1px solid #e2e8f0",borderRadius:8,marginBottom:10,overflow:"hidden"}}>
          <div style={{padding:"8px 14px",background:"#f8fafc",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
            <span style={{fontWeight:500,fontSize:13}}>{c.fecha}</span>
            <div style={{display:"flex",gap:6}}><span style={s.badge("#2563eb")}>{c.tipo_consulta}</span><span style={s.badge("#64748b")}>{c.causa_consulta}</span></div>
            <span style={{fontSize:12,color:"#64748b"}}>{c.motivo}</span>
          </div>
          <div style={{padding:"10px 14px",fontSize:13,display:"flex",flexDirection:"column",gap:4}}>
            {c.sv&&<p style={{margin:0,fontSize:12,color:"#64748b"}}>{svResumen(c.sv)}</p>}
            {c.enf_actual&&<p style={{margin:0}}><strong>Enfermedad actual:</strong> {c.enf_actual}</p>}
            {c.diagnosticos?.length>0&&(<div><strong>Dx:</strong>{c.diagnosticos.map(d=>(<span key={d.id} style={{marginLeft:8,fontSize:12}}><span style={{color:"#2563eb",fontWeight:500}}>{d.c}</span> {d.d} <span style={s.badge("#f59e0b")}>{d.tipo}</span></span>))}</div>)}
            {c.plan&&<p style={{margin:0}}><strong>Plan:</strong> {c.plan}</p>}
            {c.receta&&<p style={{margin:0}}><strong>Receta:</strong> {c.receta}</p>}
          </div>
        </div>))}
      </div>)}
      {odList.length>0&&(<div><p style={{fontWeight:500,fontSize:14,marginBottom:8}}>🦷 Consultas odontológicas</p>
        {odList.map(c=>(<div key={c.id} style={{border:"1px solid #e2e8f0",borderRadius:8,marginBottom:10,overflow:"hidden"}}>
          <div style={{padding:"8px 14px",background:"#f8fafc",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
            <span style={{fontWeight:500,fontSize:13}}>{c.fecha}</span>
            <span style={s.badge("#2563eb")}>{c.tipo_consulta}</span>
            <span style={{fontSize:12,color:"#64748b"}}>{c.motivo}</span>
          </div>
          <div style={{padding:"10px 14px",fontSize:13,display:"flex",flexDirection:"column",gap:4}}>
            {c.sv&&<p style={{margin:0,fontSize:12,color:"#64748b"}}>{svResumen(c.sv)}</p>}
            {c.examen_extraoral&&<p style={{margin:0}}><strong>Extraoral:</strong> {c.examen_extraoral}</p>}
            {c.examen_intraoral&&<p style={{margin:0}}><strong>Intraoral:</strong> {c.examen_intraoral}</p>}
            {c.odontograma&&Object.keys(c.odontograma).filter(k=>c.odontograma[k].condicion!=="Sano").length>0&&(<div><strong>Odontograma:</strong><div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}}>{Object.entries(c.odontograma).filter(([,v])=>v.condicion!=="Sano").map(([p,v])=>(<span key={p} style={s.badge(COND_COLOR[v.condicion]||"#94a3b8")}>{p}: {v.condicion}{v.nota?` · ${v.nota}`:""}</span>))}</div></div>)}
            {c.diagnosticos?.length>0&&(<div><strong>Dx:</strong>{c.diagnosticos.map(d=>(<span key={d.id} style={{marginLeft:8,fontSize:12}}><span style={{color:"#2563eb",fontWeight:500}}>{d.c}</span> {d.d} <span style={s.badge("#f59e0b")}>{d.tipo}</span></span>))}</div>)}
            {c.tratamiento_realizado&&<p style={{margin:0}}><strong>Tratamiento:</strong> {c.tratamiento_realizado}</p>}
            {c.plan&&<p style={{margin:0}}><strong>Plan:</strong> {c.plan}</p>}
          </div>
        </div>))}
      </div>)}
      {!consList.length&&!odList.length&&<p style={{fontSize:13,color:"#94a3b8"}}>Sin atenciones registradas.</p>}
    </div>)}</div>)}

    {/* TAB 7: REPORTES */}
    {tab===7&&(<div>
      <div style={{...s.grid("1fr 1fr"),marginBottom:16}}>
        <div><label style={s.label}>Fecha desde</label><input type="date" value={rf1} onChange={e=>setRf1(e.target.value)}/></div>
        <div><label style={s.label}>Fecha hasta</label><input type="date" value={rf2} onChange={e=>setRf2(e.target.value)}/></div>
      </div>
      <div style={{...s.grid("repeat(auto-fit,minmax(140px,1fr))"),marginBottom:20}}>
        {[["Total pacientes",patients.length],["Consultas médicas",consList.length],["Consultas odonto",odList.length]].map(([l,v])=>(<div key={l} style={{background:"#f1f5f9",padding:"12px 16px",borderRadius:8}}><div style={{fontSize:11,color:"#64748b",marginBottom:4}}>{l}</div><div style={{fontSize:22,fontWeight:600}}>{v}</div></div>))}
      </div>
      <button className="primary" onClick={exportCSV}>Exportar CSV — sala situacional</button>
      <p style={{fontSize:12,color:"#94a3b8",marginTop:8}}>El CSV incluye las consultas del paciente seleccionado actualmente.</p>
    </div>)}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
